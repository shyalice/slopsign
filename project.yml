name: Signer
options:
  bundleIdPrefix: io.alicehatesyou
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '26.3'
packages:
  SignerCore:
    path: Packages/SignerCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CURRENT_PROJECT_VERSION: 20
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: ''
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: '3'
      LLVM_LTO: thin
      DEAD_CODE_STRIPPING: YES
      ENABLE_TESTABILITY: NO
targets:
  Signer:
    type: application
    platform: iOS
    sources:
      - path: Signer
        excludes: [Resources/Installation]
    dependencies:
      - package: SignerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.alicehatesyou.signer
        INFOPLIST_FILE: Signer/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Signer/Resources/Signer.entitlements
    scheme:
      gatherCoverageData: false
